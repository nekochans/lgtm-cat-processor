[project]
name = "lgtm-cat-processor"
version = "0.1.0"
description = "猫のLGTM画像を生成するプロジェクト"
authors = [
    { name = "kobayashi-m42", email = "m42kobayashi@gmail.com" }
]
dependencies = [
   "boto3>=1.40.57",
    "pillow>=12.0.0",
    "boto3-stubs[s3,rekognition,s3vectors,bedrock-runtime]>=1.40.69",
    "sqlalchemy>=2.0.44",
    "mysql-connector-python>=9.5.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.4",
    "mypy>=1.18.2",
    "types-pymysql>=1.1.0.20250916",
    "pytest>=9.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lgtm_cat_processor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
